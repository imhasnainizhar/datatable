[package]
name = "flextable"
version = "0.1.0"
edition = "2021"
description = "One fast, dynamic table for Rust: a single data structure for arrays, dictionaries, records and sets."
license = "Apache-2.0"
keywords = ["table", "map", "array", "data-structure"]
categories = ["data-structures"]
readme = "README.md"
repository = "https://github.com/imhasnainizhar/flextable"
# Only the library goes to crates.io; the docs site, CI config, tests and
# benchmarks stay in the repository.
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/Cargo.toml"]

[dependencies]
hashbrown = "0.17.1"
